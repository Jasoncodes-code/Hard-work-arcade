<!doctype html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Neon Claw — Game</title><link rel="stylesheet" href="styles.css" /></head>
<body class="game-page">
  <header class="site-header"><a class="brand" href="index.html"><span class="brand-mark"><span></span><span></span><span></span></span><span>NEON<span class="brand-accent">CLAW</span></span></a><div class="points-pill"><span class="points-spark">✦</span><span><strong id="game-points">1,280</strong><small>POINTS</small></span></div></header>
  <main class="game-screen"><a class="back-link" href="index.html">← BACK TO ARCADE</a><p class="eyebrow"><span class="pulse-dot"></span> NOW PLAYING</p><h1 id="game-title">NEON CLAW</h1><p class="game-intro" id="game-intro">Move the claw, line up the prize, and press DROP.</p><div class="game-console" id="game-console"><div class="playfield" id="playfield"><div class="game-stars">✦　·　✧　　 ·　✦</div><div class="game-claw" id="game-claw"><span></span><b>⌄</b></div><div class="game-plush plush-a">🧸</div><div class="game-plush plush-b">🐰</div><div class="game-plush plush-c">🐸</div><div class="game-ground"></div></div><div class="console-bar" id="console-bar"><button id="left-btn" type="button">←</button><button id="main-btn" type="button">DROP PRIZE</button><button id="right-btn" type="button">→</button></div></div><p class="game-message" id="game-message">Use the arrows to aim your claw.</p></main>
  <script>
    const params = new URLSearchParams(location.search); const game = params.get('game') || 'neon-claw';
    const title = document.querySelector('#game-title'); const intro = document.querySelector('#game-intro'); const playfield = document.querySelector('#playfield'); const consoleBar = document.querySelector('#console-bar'); const message = document.querySelector('#game-message'); const points = document.querySelector('#game-points');
    const setPoints = (amount) => { localStorage.setItem('neonClawPoints', amount); points.textContent = amount.toLocaleString(); };
    let currentPoints = Number(localStorage.getItem('neonClawPoints') || 1280); setPoints(currentPoints);
    const earn = (amount) => { currentPoints += amount; setPoints(currentPoints); };
    const setupClaw = () => { let position = 50; const claw = document.querySelector('#game-claw'); const move = (amount) => { position = Math.max(14, Math.min(86, position + amount)); claw.style.left = position + '%'; message.textContent = 'Nice aim. Ready to drop?'; }; document.querySelector('#left-btn').onclick = () => move(-8); document.querySelector('#right-btn').onclick = () => move(8); document.querySelector('#main-btn').onclick = () => { if (Math.abs(position - 50) < 9) { earn(100); message.textContent = 'PLUSHIE CAUGHT! +100 points ✦'; } else message.textContent = 'So close! Line up with the star.'; }; document.addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') move(-8); if (e.key === 'ArrowRight') move(8); if (e.key === ' ') document.querySelector('#main-btn').click(); }); };
    const setupWheel = () => { title.textContent = 'PRIZE WHEEL'; intro.textContent = 'Spin the wheel and land on a point reward.'; message.textContent = 'Spin to win 10–500 points.'; playfield.innerHTML = '<div class="wheel" id="wheel"><span class="wheel-label label-one">10</span><span class="wheel-label label-two">25</span><span class="wheel-label label-three">50</span><span class="wheel-label label-four">100</span><span class="wheel-label label-five">250</span><span class="wheel-label label-six">500</span></div><div class="wheel-pointer">▼</div>'; consoleBar.innerHTML = '<button id="main-btn" type="button">SPIN THE WHEEL</button>'; let spinning = false; document.querySelector('#main-btn').onclick = () => { if (spinning) return; spinning = true; const reward = [10,25,50,100,250,500][Math.floor(Math.random()*6)]; const wheel = document.querySelector('#wheel'); wheel.style.transform = 'translate(-50%,-50%) rotate(' + (1080 + Math.floor(Math.random()*360)) + 'deg)'; setTimeout(() => { earn(reward); message.textContent = 'YOU LANDED ON ' + reward + '! +' + reward + ' points ✦'; spinning = false; }, 1200); }; };
    const setupCoins = () => { title.textContent = 'COIN CLICKER'; intro.textContent = 'Tap the coin as fast as you can. Every click is worth 10 points.'; message.textContent = 'Every click earns 10 points.'; playfield.innerHTML = '<button class="big-coin" id="big-coin" type="button">✦<small>+10</small><b class="coin-pop">+10</b></button><div class="coin-shine">CLICK<br />TO WIN</div>'; consoleBar.innerHTML = '<button id="main-btn" type="button">TAP THE COIN</button>'; const click = () => { earn(10); const coin = document.querySelector('#big-coin'); coin.classList.remove('coin-moving'); void coin.offsetWidth; coin.classList.add('coin-moving'); message.textContent = '+10 points! Keep tapping ✦'; }; document.querySelector('#main-btn').onclick = click; document.querySelector('#big-coin').onclick = click; };
    if (game === 'prize-wheel') setupWheel(); else if (game === 'coin-clicker') setupCoins(); else setupClaw();
  </script>
  <style>
    .game-page{min-height:100vh;background:#201a39;color:#fff}.game-page .site-header{border-color:rgba(255,255,255,.18)}.game-page .brand-mark span:first-child{background:var(--blue)}.game-screen{max-width:760px;margin:auto;padding:58px 24px 80px;text-align:center}.back-link{display:inline-block;color:rgba(255,255,255,.6);font:10px 'DM Mono',monospace;letter-spacing:.1em;margin-bottom:60px}.game-screen .eyebrow{justify-content:center}.game-screen h1{font-size:clamp(42px,8vw,72px);letter-spacing:-.07em;margin:0;color:var(--pink)}.game-intro{color:rgba(255,255,255,.65);margin:12px 0 30px}.game-console{max-width:550px;margin:auto;background:var(--pink);padding:16px;border:4px solid var(--ink);box-shadow:10px 10px 0 var(--yellow)}.playfield{height:310px;position:relative;overflow:hidden;background:#2b2348;border:4px solid var(--ink)}.game-stars{position:absolute;top:17px;left:0;right:0;color:var(--blue);font-size:13px}.game-claw{position:absolute;top:15px;left:50%;width:5px;height:170px;background:var(--yellow);transition:left .25s;z-index:2}.game-claw span{display:block;height:120px;background:var(--blue)}.game-claw b{display:block;color:var(--yellow);font-size:46px;transform:translate(-17px,-5px) rotate(180deg)}.game-plush{position:absolute;z-index:1;display:grid;place-items:center;width:52px;height:52px;border:3px solid var(--ink);border-radius:47%;font-size:29px;box-shadow:3px 3px 0 var(--pink)}.plush-a{left:19%;bottom:19%;background:var(--yellow);transform:rotate(-8deg)}.plush-b{left:47%;bottom:13%;background:var(--purple);transform:rotate(5deg)}.plush-c{right:17%;bottom:20%;background:var(--cream);transform:rotate(9deg)}.game-ground{position:absolute;bottom:0;left:0;right:0;height:18%;background:var(--pink);border-top:4px solid var(--ink)}.console-bar{display:flex;gap:12px;justify-content:center;padding:13px 0 0}.console-bar button{font:11px 'DM Mono',monospace;border:3px solid var(--ink);background:var(--yellow);padding:10px 17px;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}.console-bar button:first-child,.console-bar button:last-child{background:var(--blue);font-size:18px;padding:5px 17px}.game-message{color:var(--yellow);font:11px 'DM Mono',monospace;letter-spacing:.05em;margin-top:27px}.wheel{position:absolute;left:50%;top:50%;width:235px;height:235px;transform:translate(-50%,-50%);border:5px solid var(--ink);border-radius:50%;background:conic-gradient(var(--pink) 0 16.6%,var(--yellow) 16.6% 33.2%,var(--blue) 33.2% 49.8%,var(--purple) 49.8% 66.4%,var(--pink) 66.4% 83%,var(--yellow) 83% 100%);transition:transform 1.2s cubic-bezier(.15,.75,.2,1);box-shadow:5px 5px 0 var(--ink)}.wheel-label{position:absolute;left:100px;top:16px;color:var(--ink);font:700 16px system-ui;transform-origin:17px 100px}.label-two{transform:rotate(60deg)}.label-three{transform:rotate(120deg)}.label-four{transform:rotate(180deg)}.label-five{transform:rotate(240deg)}.label-six{transform:rotate(300deg)}.wheel-pointer{position:absolute;top:22px;left:calc(50% - 13px);z-index:2;color:var(--ink);font-size:27px}.big-coin{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:160px;height:160px;border:5px solid var(--ink);border-radius:50%;background:var(--yellow);color:var(--pink);font-size:80px;cursor:pointer;box-shadow:7px 7px 0 var(--ink);transition:transform .1s}.big-coin:active{transform:translate(-50%,-50%) scale(.92)}.big-coin small{display:block;font:11px 'DM Mono',monospace;color:var(--ink);letter-spacing:.1em}.coin-pop{position:absolute;left:60%;top:12px;color:var(--ink);font:700 20px system-ui;opacity:0}.coin-moving{animation:coin-hop .45s ease}.coin-moving .coin-pop{animation:coin-score .7s ease}.coin-shine{position:absolute;right:22px;top:31px;color:var(--blue);font:10px 'DM Mono',monospace;letter-spacing:.12em;text-align:left}@keyframes coin-hop{0%,100%{transform:translate(-50%,-50%) rotate(0)}40%{transform:translate(-50%,-58%) rotate(-8deg) scale(1.08)}70%{transform:translate(-50%,-47%) rotate(7deg)}}@keyframes coin-score{0%{opacity:0;transform:translateY(5px)}30%,70%{opacity:1}100%{opacity:0;transform:translateY(-35px)}
  </style>
</body>
</html>
